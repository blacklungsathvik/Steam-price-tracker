# web + collector share one SQLite file on a volume.
services:
  web:
    build: .
    env_file: .env
    environment: { DB_PATH: /srv/data/tracker.db }
    volumes: [ "tracker-data:/srv/data" ]
    ports: [ "8000:8000" ]
    restart: unless-stopped
  collector:
    build: .
    command: ["python", "-m", "app.collector", "--loop"]
    env_file: .env
    environment: { DB_PATH: /srv/data/tracker.db }
    volumes: [ "tracker-data:/srv/data" ]
    restart: unless-stopped
    healthcheck: { disable: true }
volumes:
  tracker-data:
